<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Red Chairs Barber — Nos mudamos</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: radial-gradient(circle at 50% 20%, rgba(156, 18, 24, 0.25) 0%, #07070a 60%);
        color: #f4f1ea;
        font-family: "Manrope", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100svh;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 480px;
        width: 100%;
      }
      .logo {
        width: 96px;
        height: 96px;
        object-fit: contain;
        margin: 0 auto 28px;
        display: block;
      }
      h1 {
        font-family: "Playfair Display", serif;
        font-weight: 700;
        font-size: clamp(1.6rem, 5vw, 2.1rem);
        margin: 0 0 16px;
        color: #f4f1ea;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.6;
        color: #dedad1;
        margin: 0 0 28px;
      }
      .new-domain {
        color: #c9a961;
        font-weight: 600;
      }
      a.cta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #c9a961;
        color: #07070a;
        font-weight: 700;
        text-decoration: none;
        padding: 14px 32px;
        border-radius: 2px;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        transition: background 0.3s ease;
      }
      a.cta:hover {
        background: #e6d3a3;
      }
      .countdown {
        margin-top: 24px;
        font-size: 0.8rem;
        color: #8a7038;
      }
      .divider {
        width: 96px;
        height: 1px;
        margin: 28px auto;
        background: linear-gradient(90deg, transparent, #c9a961, transparent);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/logo.png" alt="Red Chairs Barber" />
      <h1>Nos mudamos de dirección</h1>
      <p>
        Red Chairs Barber ahora vive en
        <span class="new-domain">redchairsbarber.digicyus.com</span>.
        Actualiza tus enlaces guardados — ahí sigue todo: reservas, servicios y tu cuenta RED CLUB.
      </p>
      <a class="cta" id="go" href="https://redchairsbarber.digicyus.com/">Ir al sitio nuevo</a>
      <div class="divider"></div>
      <p class="countdown" id="countdown">Te llevamos automáticamente en 5 segundos…</p>
    </div>
    <script>
      (function () {
        var destination = "https://redchairsbarber.digicyus.com" + window.location.pathname + window.location.search + window.location.hash;
        document.getElementById("go").href = destination;

        var seconds = 5;
        var el = document.getElementById("countdown");
        var timer = setInterval(function () {
          seconds -= 1;
          if (seconds <= 0) {
            clearInterval(timer);
            window.location.href = destination;
            return;
          }
          el.textContent = "Te llevamos automáticamente en " + seconds + " segundos…";
        }, 1000);
      })();
    </script>
  </body>
</html>
